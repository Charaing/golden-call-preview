<!doctype html>
<html lang="ko" data-type="software">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#221b18">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <meta name="description" content="아버지에게 전화를 거는 화면을 체험하는 모바일 통화 미리보기">
  <title>아버지</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script src="app.js?v=5" defer></script>
</head>
<body>
  <main class="call-screen" id="call-screen" aria-label="아버지 통화">
    <img class="call-photo" src="call-photo.jpg" width="588" height="1280" alt="아버지" draggable="false">
    <time id="call-timer" class="timer" datetime="PT0S" aria-label="경과 시간 0초">00:00</time>
    <div class="captions upper-captions" aria-hidden="true"><span>Speaker</span><span>FaceTime</span><span>Mute</span></div>
    <div class="captions lower-captions" aria-hidden="true"><span>More</span><span>End</span><span>Keypad</span></div>
    <button class="hotspot" id="speaker" type="button" aria-label="Speaker" aria-pressed="false"></button>
    <button class="hotspot" id="mute" type="button" aria-label="Mute" aria-pressed="false"></button>
  </main>
</body>
</html>
